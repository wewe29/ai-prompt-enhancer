name: Bootstrap release

# This workflow publishes the v0.3.0 GitHub Release with portable assets
# and lists any open Dependabot pull requests.
#
# Trigger: manual "Run workflow" from the Actions tab.
#
# What this workflow does NOT do (and why):
#   - Update repository description and topics. The GitHub Actions
#     `GITHUB_TOKEN` does not carry admin/owner scope, and the
#     PATCH /repos/{owner}/{repo} endpoint requires admin/owner.
#     Set description and topics via the GitHub web UI instead.
#   - Enable Discussions. Same reason. Enable it in
#     Settings → General → Features.
#
# Uses only tools that ship with `ubuntu-latest` plus the official
# `actions/*` actions — no gh CLI install required.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    name: Publish v0.3.0 and list Dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish v0.3.0 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          name: PromptCraft 0.3.0 — Minimal-intervention enhancement with trustworthy evaluation
          body_path: release-assets/RELEASE_NOTES-v0.3.0.md
          target_commitish: main
          fail_on_unmatched_files: true
          files: |
            release/PromptCraft-0.3.0-windows-x64-portable.zip
            release-assets/SHA256-zip.txt
            release-assets/SHA256-webview2.txt
            release-assets/README.txt

      - name: List open Dependabot pull requests
        uses: actions/github-script@v7
        with:
          script: |
            // github-script v7: REST API methods are under github.rest.*
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const deps = prs.filter(pr => pr.user && pr.user.login === 'dependabot[bot]');
            console.log(`Open Dependabot pull requests: ${deps.length}`);
            for (const pr of deps) {
              console.log(`- #${pr.number} ${pr.title} (${pr.html_url})`);
            }

      - name: Summary
        run: |
          echo "Bootstrap complete."
          echo "Repository : https://github.com/${GITHUB_REPOSITORY}"
          echo "Release    : https://github.com/${GITHUB_REPOSITORY}/releases/tag/v0.3.0"
