[package]
name = "prompt-craft"
version = "0.3.0"
description = "Local AI prompt enhancer for Windows"
authors = ["wewe29"]
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/wewe29/ai-prompt-enhancer"

[lib]
name = "prompt_craft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3.6"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
futures-util = "0.3"
hex = "0.4"
keyring = { version = "3", features = ["windows-native"] }
once_cell = "1.21"
open = "5.3"
pdf-extract = "0.10"
quick-xml = "0.38"
rand = "0.9"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled-sqlcipher"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros"] }
tokio-util = "0.7"
url = "2.5"
uuid = { version = "1.16", features = ["v4", "serde"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Memory"] }
