# 用户画像定义：模拟不同类别的用户会怎样写出原始提示词。
# 评测时用 --personas novice,student,office 展开；不指定时行为与旧版完全一致。
# 难度差异化语义：同一难度下各画像保持与 original 相同的核心任务与事实，
# 但信息难度不同——novice 丢失关键约束、office 注入冲突约束、student 植入错误前提。
personas:
  novice:
    label: 纯AI小白
    note: 丢失关键约束：只留模糊意图与口语化表达，删掉受众、长度、格式、事实边界、具体需求等关键约束
  student:
    label: 学生
    note: 错误前提：植入合理但错误的假设（字段名、数字/日期、归因、规格），考验增强器是否识别并纠正
  office:
    label: 普通办公员工
    note: 冲突约束：提出互相矛盾的需求（如"要详细但不能太长""要专业但别用术语""要完整但不能超一页"）
