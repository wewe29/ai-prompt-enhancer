# PromptCraft 评测脚本配置
# 说明：
# - API Key 读取优先级由 key_source 控制：keyring（读取 PromptCraft 已存的 Key）→ env → config
# - targets 的 selectors 为各网页版站点的 DOM 选择器，站点改版时可在此调整
# - 可运行 `python run_eval.py --login` 打开浏览器手动登录后，再用 `python run_eval.py` 全量评测

enhancer:
  base_url: https://api.deepseek.com     # DeepSeek 原账号（keyring 密钥），与火山目标模型解耦
  protocol: openai                  # openai | anthropic（当前使用 OpenAI 兼容协议）
  model: deepseek-v4-flash          # 增强器模型（与火山 plan_deepseek 目标同模型但不同部署，可报告自偏风险）
  verbosity: standard               # concise | standard | deep | custom
  custom_instructions: ""           # 自定义增强要求（可选）
  temperature: 0.35                 # 与 PromptCraft 后端一致

# 按场景的生成温度（场景关键字 → 温度）；样本自带 temperature 字段优先
scenario_temperatures:
  编程: 0.2
  翻译: 0.2
  数据分析: 0.2
  问答: 0.4
  写作: 0.5
  模糊请求: 0.5
  创意: 0.7

key_source: keyring                    # keyring | env | config
# api_key: ""                          # 仅当 key_source=config 时填写（请勿提交到版本库）

browser:
  mode: playwright                     # playwright（持久浏览器+登录态）| cdp（连接已启动的浏览器:9222）
  channel: msedge                      # 用哪个浏览器：msedge=系统Edge（推荐）| chrome=系统Chrome | chromium=Playwright自带
  cdp_url: http://localhost:9222
  headless: false                      # 网页版建议有头模式（部分站点无头环境可能触发风控）
  slow_input_chars: 200                # 慢速输入每批字符数
  input_delay_ms: 30                   # 慢速输入每字符延迟（毫秒）

targets:
  deepseek_web:
    enabled: true
    mode: web
    url: https://chat.deepseek.com/
    timeout: 30                   # 生成超时等待（秒），超时后兜底返回已生成的部分内容
    stabilize_seconds: 6          # 输出文本连续 N 秒不变视为完成（需小于 timeout）
    wait_strategy: stop_button    # stop_button | stabilize（统一判定逻辑下主要作为参考）
    selectors:
      input: ["#chat-input", "textarea", "[contenteditable='true']"]
      send: ""                    # 留空 = 按回车发送
      stop: ["div[class*='stop']", "button[class*='stop']", ".ds-icon-button"]
      output_selector: [".ds-markdown", "div[class*='markdown']", "div[class*='message-content']"]
      new_chat: ["button:has-text('新对话')", "div[class*='new-chat']"]
      include_code: true

  doubao:
    enabled: true
    mode: web
    url: https://www.doubao.com/chat/
    timeout: 30                   # 生成超时等待（秒）
    stabilize_seconds: 6          # 豆包停止按钮选择器不可靠，主要依赖文本稳定判定
    wait_strategy: stabilize
    selectors:
      input: ["textarea.semi-input-textarea", "textarea[placeholder*='发消息']", "textarea", "div[contenteditable='true']"]
      send: ""                    # 留空 = 按回车发送
      stop: ["div[class*='stop']", "button[class*='stop']"]
      output_selector: [
        "[class*='v_list_row']",
        "div[class*='message-list']",
        "[class*='message'] [class*='content']",
        "[class*='message'] [class*='markdown']",
        "[class*='answer']",
        "[class*='chat'] [class*='message']",
        "div[class*='message']:last-of-type",
        "[class*='markdown']"
      ]
      new_chat: ["div[class*='new-chat']", "button:has-text('新对话')"]
      include_code: true

  qwen:
    enabled: true
    mode: web
    url: https://www.qianwen.com/     # 原 tongyi.aliyun.com/qianwen/ 已重定向到 qianwen.com
    timeout: 45                   # 生成超时等待（秒）
    stabilize_seconds: 6
    wait_strategy: stop_button
    selectors:
      input: ["[class*='whitespace-pre-wrap'][contenteditable='true']", "div[contenteditable='true']", "textarea", "#chat-input"]
      send: ""                    # 留空=回车发送；千问回车不发送时脚本会自动点击发送图标兜底
      stop: ["div[class*='stop']", "button[class*='stop']"]
      output_selector: [
        "[class*='markdown']",
        "div[class*='answer']",
        "div[class*='message']:last-of-type",
        "main [class*='whitespace-pre-wrap']",
        "main"
      ]
      new_chat: ["button:has-text('新建对话')", "div:has-text('新建对话')"]
      include_code: true

  minimax:
    enabled: false                # 注：chat.minimaxi.com 已重定向到 MiniMax Agent（agent.minimaxi.com），需确认新聊天地址后再启用
    mode: web
    url: https://chat.minimaxi.com/
    timeout: 30                   # 生成超时等待（秒）
    stabilize_seconds: 6
    wait_strategy: stabilize
    selectors:
      input: ["textarea", "div[contenteditable='true']"]
      send: ["button[class*='send']", "div[class*='send']"]
      stop: ["button[class*='stop']", "div[class*='stop']"]
      output_selector: ["div[class*='markdown']", "div[class*='message']:last-of-type"]
      new_chat: ["button:has-text('新对话')"]
      include_code: true

  # 火山方舟 Agent Plan 目标（Anthropic Messages 协议，/api/plan 端点）
  # 密钥从环境变量 ARK_PLAN_API_KEY 读取（api_key_env），不会写入本文件
  # 目标模型列表 = probe_targets.py 探测可用集合剔除 deepseek-v4-flash（裁判/增强器同模型，§6.5 解耦）
  # 探测日期 2026-08-12：doubao-seed-2.0-mini / glm-5.2 / deepseek-v4-flash /
  #   doubao-seed-2-0-pro-260215 / glm-5-2-260617 可用；其余候选 404
  plan_doubao:
    enabled: true
    mode: anthropic
    base_url: https://ark.cn-beijing.volces.com/api/plan
    model: doubao-seed-2.0-mini
    api_key_env: ARK_PLAN_API_KEY
    temperature: 0.7
    max_tokens: 4096

  plan_glm:
    enabled: true
    mode: anthropic
    base_url: https://ark.cn-beijing.volces.com/api/plan
    model: glm-5.2
    api_key_env: ARK_PLAN_API_KEY
    temperature: 0.7
    max_tokens: 4096

  plan_doubao_pro:
    enabled: true
    mode: anthropic
    base_url: https://ark.cn-beijing.volces.com/api/plan
    model: doubao-seed-2-0-pro-260215
    api_key_env: ARK_PLAN_API_KEY
    temperature: 0.7
    max_tokens: 4096

  plan_glm_5_2:
    enabled: true
    mode: anthropic
    base_url: https://ark.cn-beijing.volces.com/api/plan
    model: glm-5-2-260617
    api_key_env: ARK_PLAN_API_KEY
    temperature: 0.7
    max_tokens: 4096

  plan_deepseek:
    enabled: false                # 与裁判/增强器同模型部署，§6.5 解耦要求剔除，不作为评测目标
    mode: anthropic
    base_url: https://ark.cn-beijing.volces.com/api/plan
    model: deepseek-v4-flash
    api_key_env: ARK_PLAN_API_KEY
    temperature: 0.7
    max_tokens: 4096

  # 火山方舟 API 直连目标（OpenAI 兼容接口，替代网页版抓取）
  # 密钥从环境变量 ARK_API_KEY 读取（api_key_env），不会写入本文件
  ark_doubao:
    enabled: true
    mode: api
    base_url: https://ark.cn-beijing.volces.com/api/v3
    model: doubao-seed-2-1-pro-260628
    api_key_env: ARK_API_KEY
    temperature: 0.7

  ark_deepseek:
    enabled: true
    mode: api
    base_url: https://ark.cn-beijing.volces.com/api/v3
    model: deepseek-v4-flash-ga-260731
    api_key_env: ARK_API_KEY
    temperature: 0.7

  ark_qwen:
    enabled: false                # 控制台开通 qwen3-32b-20250429 后启用
    mode: api
    base_url: https://ark.cn-beijing.volces.com/api/v3
    model: qwen3-32b-20250429
    api_key_env: ARK_API_KEY
    temperature: 0.7

  ark_glm:
    enabled: true
    mode: api
    base_url: https://ark.cn-beijing.volces.com/api/v3
    model: glm-5-2-260617
    api_key_env: ARK_API_KEY
    temperature: 0.7

  ark_kimi:
    enabled: false                # 控制台开通 kimi-k2-250905 后启用
    mode: api
    base_url: https://ark.cn-beijing.volces.com/api/v3
    model: kimi-k2-250905
    api_key_env: ARK_API_KEY
    temperature: 0.7

  # 备用：直接把提示词发给 OpenAI 兼容 API（无网页访问时使用，需 base_url/model/api_key）
  # custom_api:
  #   enabled: false
  #   mode: api
  #   base_url: https://api.deepseek.com
  #   model: deepseek-chat
  #   temperature: 0.7

judge:
  base_url: https://ark.cn-beijing.volces.com/api/plan/v1  # 裁判走 plan 端点 OpenAI 兼容路径（deepseek-v4-flash 在 plan 可用）
  api_key_env: ARK_PLAN_API_KEY   # 裁判密钥（plan 端点密钥；未设置时回退 key.local）
  api_key_file: key.local         # 裁判密钥文件兜底（与 bench 一致）
  model: deepseek-v4-flash
  temperature: 0
  randomize_order: true               # 随机互换 A/B 消除位置偏差
  cross_check: false                  # 每条独立再评一次交叉验证（增加成本）
  # second_model: doubao-seed-2-1-pro  # 交叉验证的第二裁判模型（cross_check: true 时生效）

samples: samples/samples.yaml

run:
  delay_between: 2.0                  # 秒，网页请求间隔（避免限流）
  max_cost_usd: 2.0                   # 增强+裁判的 API 预算保护
  retry_seconds: 60                   # 限流后等待重试的秒数
  control_group: true                 # A/B/C 三组对照默认开启（--no-control-group 关闭）
  repeats: 1                          # 每个(样本×目标×变体)的重复次数（正式运行用 3）
