samples:
- id: v30_code_decorator_retry
  scenario: 编程
  ambiguity_level: clear
  original: "帮我审查下面这个 Python 装饰器，重点是并发场景下计数器是否会竞态，以及重试逻辑是否符合指数退避约定。\n只指出问题并说明原因，不要重写代码：\n\
    ```python\nimport threading, time\n\nattempts = {\"count\": 0}\n\ndef retry(max_attempts=3,\
    \ base_delay=1.0):\n    def deco(fn):\n        def wrapper(*args, **kwargs):\n\
    \            attempts[\"count\"] += 1\n            for i in range(max_attempts):\n\
    \                try:\n                    return fn(*args, **kwargs)\n      \
    \          except Exception:\n                    if i == max_attempts - 1:\n\
    \                        raise\n                    time.sleep(base_delay * (2\
    \ ** i))\n        return wrapper\n    return deco\n```\n输出请按「问题清单 + 原因 + 影响」三段组织，最多\
    \ 5 条。\n"
  must_preserve:
  - 指数退避
  - 只指出问题并说明原因
  - max_attempts
  - base_delay
  must_not_add:
  - 不要要求补充运行环境信息
  - 不要虚构性能测试数据
  expected_behavior: none
- id: v30_rust_borrow_fix
  scenario: 编程
  ambiguity_level: clear
  original: "这段 Rust 编译不过，报 borrow checker 错误：\n```rust\nfn push_all(v: &mut Vec<i32>,\
    \ src: &Vec<i32>) {\n    for &x in src {\n        v.push(x);\n    }\n}\nlet mut\
    \ a = vec![1, 2];\npush_all(&mut a, &a);\n```\n请给出能通过编译的最小修改，保持 push_all 的行为不变，并解释为什么原来的写法不允许。\n\
    运行环境是 Rust 1.80，不使用 unsafe。\n"
  must_preserve:
  - push_all
  - Vec<i32>
  - unsafe
  - Rust 1.80
  must_not_add:
  - 不要引入第三方 crate
  - 不要要求补充完整错误信息原文
  expected_behavior: none
- id: v30_onboarding_doc
  scenario: 办公写作
  ambiguity_level: clear
  original: '为新入职的 Python 后端工程师写一份入职第一周指引文档，包含：环境搭建、代码规范、常用命令、求助对象四部分。

    项目用 FastAPI + PostgreSQL，代码规范遵循 PEP 8，环境要求 Python 3.11。

    文档要简洁，每部分不超过 5 条，直接给出可操作内容。

    '
  must_preserve:
  - FastAPI
  - PostgreSQL
  - PEP 8
  - Python 3.11
  must_not_add:
  - 不要虚构公司内部工具名称
  - 不要添加入职培训的具体课表
  expected_behavior: light
- id: v30_qa_sql_injection
  scenario: 问答
  ambiguity_level: clear
  original: '给刚入行的 Java 开发讲清楚 SQL 注入：什么是注入、一个真实示例、如何用参数化查询防御。

    要求分三段，给出可运行的示例代码，并强调只允许使用原生 JDBC 预编译语句（PreparedStatement），禁用字符串拼接。

    '
  must_preserve:
  - SQL 注入
  - 参数化
  - PreparedStatement
  - 字符串拼接
  must_not_add:
  - 不要要求补充具体数据库类型
  - 不要引入 ORM 框架推荐
  expected_behavior: none
- id: v30_data_sql_cohort
  scenario: 数据分析
  ambiguity_level: clear
  original: '订单表 orders(id, user_id, amount, order_date)，用户表 users(id, signup_date)。

    写 SQL 计算 2024 年 1 月注册用户的 30 天留存率：按注册周分组，统计该周注册用户在注册后 30 天内下过单的人数占比。

    要求：一条查询完成，使用窗口函数按注册周分组，输出注册周与留存率两列，金额字段不影响结果。

    '
  must_preserve:
  - orders
  - signup_date
  - 30 天
  - 注册周
  must_not_add:
  - 不要虚构数据仓库表名
  - 不要添加留存口径之外的指标
  expected_behavior: none
- id: v30_translate_api_doc
  scenario: 翻译
  ambiguity_level: clear
  original: '把这段 API 接口说明翻译成日文，代码、字段名和 URL 一律保留原样：

    「调用 GET /api/v1/users 获取用户列表，返回 JSON 数组。参数 page 用于分页，默认 1，每页最多 50 条。

    认证方式为 Bearer Token，缺少令牌时返回 401。」

    目标读者是日方合作团队的技术成员，使用书面语。

    '
  must_preserve:
  - /api/v1/users
  - Bearer Token
  - '401'
  - page
  must_not_add:
  - 不要虚构错误码以外的接口行为
  - 不要添加调用示例代码
  expected_behavior: none
