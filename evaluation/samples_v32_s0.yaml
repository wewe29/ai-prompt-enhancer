- id: v30_office_annual_report
  scenario: 办公写作
  ambiguity_level: medium
  original: '帮我写今年部门的年度工作报告，今年主要做了三个项目：新官网上线、客户管理系统重构、数据中台一期。

    年度销售额同比增长 18%，客户满意度从 82 分升到 88 分。

    请你帮忙组织成一篇完整的报告。

    '
  must_preserve:
