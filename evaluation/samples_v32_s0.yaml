  scenario: 创意
  ambiguity_level: clear
  original: '写一首关于深夜便利店的现代短诗，要求：不超过 8 行，出现「灯光」和「收银机」两个意象，

    情感基调孤独但不消极，避免「寂静」「孤独」等直白词语，不押韵。

