  - id: v30_js_promise_race
    scenario: 编程
    ambiguity_level: clear
    original: |
      下面这段 JavaScript 有竞态问题：并发请求时，先发出但后返回的请求会覆盖后发请求的结果。
      请修复 fetchUser，让结果始终来自最后一次发出的请求，同时保留 AbortController 的取消能力，不改动调用方。
      ```javascript
      function fetchUser(id) {
        const controller = new AbortController();
        return fetch(`/api/user/${id}`, { signal: controller.signal }).then(r => r.json());
      }
      ```
      输出修复后的完整函数，并解释改动点。
    must_preserve: ["fetchUser", "AbortController", "最后一次发出的请求", "改动点"]
    must_not_add: ["不要虚构接口返回的数据结构", "不要要求补充用户接口文档"]
    expected_behavior: none

  - id: v30_rust_borrow_fix
    scenario: 编程
    ambiguity_level: clear
    original: |
      这段 Rust 编译不过，报 borrow checker 错误：
      ```rust
      fn push_all(v: &mut Vec<i32>, src: &Vec<i32>) {
          for &x in src {
              v.push(x);
          }
      }
      let mut a = vec![1, 2];
      push_all(&mut a, &a);
      ```
      请给出能通过编译的最小修改，保持 push_all 的行为不变，并解释为什么原来的写法不允许。
      运行环境是 Rust 1.80，不使用 unsafe。
    must_preserve: ["push_all", "Vec<i32>", "unsafe", "Rust 1.80"]
    must_not_add: ["不要引入第三方 crate", "不要要求补充完整错误信息原文"]
    expected_behavior: none

