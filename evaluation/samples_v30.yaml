# PromptCraft v0.3.0 正式评测样本集（规格 §6.2 / 计划 Phase 4）
# 60 条 = 20 clear（目标/背景/约束/格式基本完整）+ 20 medium（缺 1-2 个关键要素）+ 20 severe（必须澄清或明确假设）。
# 每档覆盖 6 个场景：编程 / 办公写作 / 问答 / 数据分析 / 翻译 / 创意（每格 ≥3，余量给 编程/办公写作）。
# 字段：id / scenario / ambiguity_level / original / must_preserve[] / must_not_add[] / expected_behavior。
# 无 personas：模糊等级即画像。id 统一 v30_ 前缀，与 samples.yaml 不冲突。
# must_preserve 中的子串必须在 original 中出现且增强后不得丢失；
# must_not_add 是增强器不得自行发明/强加的约束。
# expected_behavior：clear→none|light；medium→light；severe→clarify。

samples:
  # ================= clear（20）=================
  # ---- 编程（4）----
  - id: v30_code_decorator_retry
    scenario: 编程
    ambiguity_level: clear
    original: |
      帮我审查下面这个 Python 装饰器，重点是并发场景下计数器是否会竞态，以及重试逻辑是否符合指数退避约定。
      只指出问题并说明原因，不要重写代码：
      ```python
      import threading, time

      attempts = {"count": 0}

      def retry(max_attempts=3, base_delay=1.0):
          def deco(fn):
              def wrapper(*args, **kwargs):
                  attempts["count"] += 1
                  for i in range(max_attempts):
                      try:
                          return fn(*args, **kwargs)
                      except Exception:
                          if i == max_attempts - 1:
                              raise
                          time.sleep(base_delay * (2 ** i))
              return wrapper
          return deco
      ```
      输出请按「问题清单 + 原因 + 影响」三段组织，最多 5 条。
    must_preserve: ["指数退避", "只指出问题并说明原因", "max_attempts", "base_delay"]
    must_not_add: ["不要要求补充运行环境信息", "不要虚构性能测试数据"]
    expected_behavior: none

