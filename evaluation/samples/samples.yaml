  - id: minimal_intervention
    scenario: 写作
    original: |
      帮我写一封给客户道歉的邮件，客户是中型企业的采购负责人，
      原因是我们的产品交付延期了两周。语气要诚恳但不卑微，
      长度控制在 200 字以内，最后给出补偿方案（延长 30 天免费支持）。
    personas:
      novice: 帮我写封邮件,跟客户道歉,我们东西交晚了,要诚恳一点但别太那啥,别超过200字,最后说一下给客户延长30天支持,客户是中型企业的采购负责人
      student: 老师布置的商务写作作业:写一封给客户的道歉邮件,客户是中型企业采购负责人,因为产品交付延期两周,要诚恳但不卑微,200字以内,最后要写补偿方案,延长30天免费支持
      office: 我们产品交付延期了两周,需要给客户发一封道歉邮件,客户是中型企业的采购负责人,语气诚恳但不卑微,200字以内,结尾给出延长30天免费支持的补偿方案

  - id: creative_free_poem
    scenario: 创意
    original: |
      用现代诗的风格写一首关于秋天下午的短诗，不要太长，别用太常见的意象。
    personas:
      novice: 帮我写一首诗,现代诗那种,写秋天下午的,短一点,别用那些大家都写烂了的词
      student: 语文课作业,写一首关于秋天下午的现代诗,要求不要太长,意象别太俗套
      office: 我们需要一首现代诗,主题是秋天下午,篇幅要短,避免常见的意象,用于内部活动
