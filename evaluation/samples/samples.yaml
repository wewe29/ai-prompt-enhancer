# PromptCraft 评测样本集
# 覆盖编程 / 写作 / 问答 / 翻译 / 数据分析 / 创意 等场景
# 每个样本的 personas 按难度差异化改写：novice 丢失关键约束 / office 冲突约束 / student 错误前提
# 末尾 6 条为 "rough real-user" 样本（一句话/缺对象/口语化/逻辑跳跃），用于考验增强器补全信息的能力

samples:
  - id: code_fix_memory_leak
    scenario: 编程
    original: |
      帮我看看这段 Python 代码为什么内存一直涨，修复一下：
      ```python
      import time

      def load_data():
          rows = []
          while True:
              rows.append("x" * 1024 * 1024)
              if len(rows) % 10 == 0:
                  rows.clear()
              time.sleep(0.1)

       load_data()
       ```
       这个程序跑几分钟内存就爆了，问题出在哪？
    personas:
      novice: 我写了个python程序,跑着跑着内存就一直涨,然后就爆了,咋回事啊,帮我看看呗
      student: 老师布置的作业,说这段代码内存泄漏,是因为列表没清干净,但我看了好像没列表,帮我确认问题到底出在哪,作业要交
      office: 我们这程序跑几分钟内存就爆了,要尽快处理,但改的时候不能动业务逻辑,还得把原因和修复方案写清楚

  - id: git_rebase_conflict
    scenario: 编程
    original: |
      git rebase 的时候报这个错，怎么处理？
      ```
      CONFLICT (content): Merge conflict in src/config.py
      Automatic merge failed; fix conflicts and then commit the result.
      ```
       我不太懂 rebase 和 merge 的区别，帮我解释一下，再告诉我在这个情况下应该怎么一步步解决。
    personas:
      novice: git报错了,一堆英文看不懂,好像是冲突,怎么办啊,帮我弄一下
      student: 老师布置的作业,我在feature分支上执行了git merge,老师说要用rebase,现在报冲突代码全乱了,帮我恢复一下,顺便说下rebase和merge的区别
      office: 我们项目rebase卡在冲突上了,提交历史不能变,还得尽快解开,把每一步写清楚,别用一堆术语

  - id: product_launch_announcement
    scenario: 写作
    original: |
      我们公司下周要发布一款新的协作工具「轻舟」，支持多人实时编辑、任务看板和在线会议，主打中小团队。
       帮我写一份正式的产品发布公告，要包括标题、正文，最后加个行动号召让大家去官网注册试用。
    personas:
      novice: 我们要发个产品公告,帮我写一个
      student: 老师布置的作业,公司新产品「轻舟」上周就上线了,要补一份正式发布公告,含标题正文和让大家去官网注册的号召
      office: 我们下周发布「轻舟」,要正式的产品发布公告,要大气但不能空喊口号,卖点都要覆盖但只写一页,还要有注册号召

  - id: tech_to_layman
    scenario: 写作
    original: |
      把下面这段技术文档改成让不懂技术的人也能看懂的科普说明，语气轻松一点：
       「本系统采用微服务架构，通过消息队列实现服务间异步解耦，使用分布式事务保证最终一致性，
       配合容器编排平台实现弹性伸缩，多副本部署提升可用性。」
    personas:
      novice: 我司那个产品介绍,全是专业词,客户看不懂,帮我整成大白话
      student: 老师布置的作业,把这段技术文档改写成科普说明,文档讲的是用Kafka做消息队列解耦,帮我翻成大白话
      office: 我们要把这段技术介绍改成客户能看懂的版本,要简单易懂但不能丢掉技术要点,语气要轻松但不能太口语,一页以内

  - id: qa_deepseek_arch
    scenario: 问答
    original: |
      DeepSeek 的上下文窗口有多大？它的 MoE 结构是怎么回事？参数量到底是多少？
       如果我不确定，请明确说出来，不要编造。另外对比一下它和传统 Dense 模型在推理成本上的差别。
    personas:
      novice: DeepSeek是啥,听人家说很厉害,帮我介绍下呗
      student: 老师布置的作业,查一下DeepSeek最新的版本,上下文窗口是128K还是1M,听说参数量有7万亿,帮我核实,不确定的别编
      office: 我们评估DeepSeek能不能上生产,要一份评估:上下文窗口、MoE结构、参数量、推理成本对比,要全面准确,但两段话讲完,还得能直接贴给老板看

  - id: qa_distributed_tx_cap
    scenario: 问答
    original: |
      用大白话给我讲清楚分布式事务和 CAP 定理的关系。什么场景下必须用分布式事务？
       2PC、TCC、Saga 各自适合什么情况？最好给个电商下单的例子。
    personas:
      novice: 分布式事务是啥,跟CAP啥关系,用大白话讲讲
      student: 老师布置的作业,我们系统用ZooKeeper做事务协调,帮我讲下分布式事务和CAP的关系,2PC、TCC、Saga怎么选,给个电商下单的例子
      office: 我们下单功能跨多个系统,要写进技术方案,用大白话解释分布式事务和CAP,要通俗但得严谨,给个电商例子,别超过两页

  - id: translate_contract_clause
    scenario: 翻译
    original: |
      把下面这段合同条款翻译成英文，要用正式的法律语言，专有名词保留原名，不要添加或删减意思：
      「乙方应在合同生效后三十个工作日内完成交付，逾期超过十五日的，甲方有权解除本合同，
      并要求乙方支付合同总金额百分之十的违约金。双方因履行本合同发生争议的，
       应提交中国国际经济贸易仲裁委员会按其届时有效的仲裁规则仲裁解决。」
    personas:
      novice: 这段合同条款帮我翻成英文
      student: 老师布置的作业,把这段合同条款翻译成英文,注意交付期限是30个自然日不是工作日,要用正式法律语言,专有名词保留原名
      office: 这段条款要翻成英文给法务和客户看,要用正式法律语言,不能增删意思,但还得让不懂中国法律的客户看得懂

  - id: data_analysis_sql
    scenario: 数据分析
    original: |
      我有一张销售订单表 orders：id, user_id, product_id, amount, city, order_date。
      帮我写 SQL 统计：每个城市每月的销售额、订单数、客单价，还要和上月对比环比变化。
       顺便告诉我这个结果应该怎么解读，重点看什么。
    personas:
      novice: 我有一张卖东西的订单表,帮我统计下每个城市每个月卖了多少,还想跟上月比一比,我不会写SQL
      student: 老师布置的作业,有一张销售订单表orders,字段是id,user_id,product_id,amount,user_city,order_time,统计每个城市每月销售额、订单数、客单价,还要环比
      office: 我们销售月报要用,统计每个城市每月的销售额、订单数、客单价和环比,SQL和解读都要,但别搞太复杂,一个查询能跑完最好

  - id: creative_ad_copy
    scenario: 创意
    original: |
      帮我写3版暑期少儿编程班的广告文案。目标人群是 8-12 岁孩子的家长，
       卖点是培养逻辑思维、Scratch/Python 入门、小班教学。每版风格不同，都要有标题和一句话 slogan。
    personas:
      novice: 帮我写个少儿编程班的暑期招生广告
      student: 老师布置的作业,给暑期少儿编程班写广告文案,目标人群是6-10岁孩子的家长,卖点是培养逻辑思维、Scratch/Python入门、小班教学,3版不同风格,都要标题和slogan
      office: 我们编程班暑期招生,要3版广告文案,要风格多样但品牌调性得统一,突出逻辑思维、Scratch/Python和小班教学,每版都要标题和slogan,但不能太长,朋友圈和海报都能用

  - id: vague_request
    scenario: 模糊请求
    original: |
      帮我写个方案。
    personas:
      novice: 帮我写个方案呗,我还没想好写啥,你帮我写一个
      student: 老师布置的作业,要写一份校庆活动方案,帮我写一下,要交的
      office: 我们部门要交一份方案,内容要完整全面,但别太长,格式要正式,语言要通俗

  - id: minimal_intervention
    scenario: 写作
    original: |
      帮我写一封给客户道歉的邮件，客户是中型企业的采购负责人，
      原因是我们的产品交付延期了两周。语气要诚恳但不卑微，
      长度控制在 200 字以内，最后给出补偿方案（延长 30 天免费支持）。
    personas:
      novice: 帮我写封邮件跟客户道歉,我们东西交晚了,客户挺重要的
      student: 老师布置的商务写作作业,写一封给客户的道歉邮件,客户是中型企业的采购负责人,原因是我们的产品交付延期了两个月,要诚恳但不卑微,200字以内,最后给补偿方案,延长30天免费支持
      office: 客户催得紧,邮件要写得详细全面一点,但最好一页以内,别太长

  - id: creative_free_poem
    scenario: 创意
    original: |
      用现代诗的风格写一首关于秋天下午的短诗，不要太长，别用太常见的意象。
    personas:
      novice: 帮我写一首诗,现代诗,秋天下午的
      student: 语文课作业,写一首关于秋天下午的现代诗,老师说现代诗也得押韵,每段三行,别用太常见的意象
      office: 我们内部活动要用一首现代诗,主题秋天下午,要短但要有深度,别用常见意象,但大家又都要能看懂

  - id: translate_marketing_copy
    scenario: 翻译
    original: |
      把下面这段中文产品营销文案翻译成英文，要保留品牌语气和 slogan 的押韵感：
      「轻舟协作工具：让团队告别来回传文件！实时编辑、任务看板、在线会议，一个空间搞定一切。现在注册，30 天免费试用。」
    personas:
      novice: 这段产品介绍帮我翻成英文,我们这工具挺好用的,翻得洋气点
      student: 老师布置的作业,把这段中文营销文案翻译成英文,品牌名叫「轻舟」,老师说品牌名在英文里就叫LightBoat,还要保持slogan押韵
      office: 这段文案要翻成英文给海外客户看,必须忠于原文不能改意思,但又要地道有营销感,不能翻译腔

  - id: translate_tech_doc
    scenario: 翻译
    original: |
      把下面这段中文技术文档翻译成英文，代码和命令保留原文：
      「运行 npm install 后若提示 EACCES 权限错误，请勿使用 sudo，改用 --prefix 指定安装目录，或配置 userconfig 文件。」
    personas:
      novice: 这段技术文档帮我翻成英文,发给老外看的
      student: 老师布置的作业,把这段技术文档翻译成英文,文档说npm install报EACCES,我用的是pnpm装的也报一样的错,帮我把这个也翻进去
      office: 要翻成英文,命令和代码必须原样保留,但读者是不懂命令行的新手,得加点说明,又不能超过一页

  - id: data_report_interpret
    scenario: 数据分析
    original: |
      我有一张今年各区域的季度销售表（单位：万元）：

      | 区域 | Q1  | Q2  | Q3  | Q4  |
      |------|-----|-----|-----|-----|
      | 华东 | 120 | 135 | 150 | 168 |
      | 华南 | 100 | 98  | 160 | 102 |
      | 华北 | 90  | 84  | 78  | 71  |

      帮我解读一下销售趋势，指出有没有异常，最后给出结论和建议。
    personas:
      novice: 我有一张销售表,三个区域四个季度,你帮我看看我们卖得咋样,有没有啥问题
      student: 老师布置的作业,解读这张季度销售表,老师说华南Q3那个160万是录错的,实际是60万,按60万分析
      office: 我们季度销售会要讲这份表,要解读趋势、指出异常、给结论和建议,但报告必须一页以内,讲完还得能直接念

  - id: data_cleaning_doc
    scenario: 数据分析
    original: |
      我们有一份用户调研问卷数据，需要梳理统计口径并给出清洗方案说明，包括：
      1. 缺失值怎么处理（哪些字段可以补、怎么补、补不了的怎么办）
      2. 重复记录怎么判定和去重（同一个人填多份怎么办）
      3. 分组对比怎么做（按什么维度分组、样本量不同的区域怎么比）
    personas:
      novice: 我们有一份用户调研的数据,挺乱的,帮我理一下,把数据弄干净
      student: 老师布置的作业,梳理问卷数据的统计口径,老师说缺失超过20%的字段直接删掉,重复记录按姓名去重,分组按省份比
      office: 要出清洗方案,缺失值、去重、分组对比都要覆盖,但方案要一页讲完,还要给能直接执行的规则,别整术语

  - id: rough_optimize
    scenario: 模糊
    original: 帮我优化一下
    personas:
      novice: 帮我优化一下
      student: 帮我优化一下,我们目标是评分95以上,之前才80
      office: 帮我优化一下,要具体但不能太长,别只给空话

  - id: rough_code_bug
    scenario: 编程
    original: 这段代码有问题
    personas:
      novice: 这段代码有问题
      student: 这段代码有问题,我怀疑是死循环,帮我看下
      office: 这段代码有问题,帮我修,要改得彻底一点,但只能动一行代码,今晚还要上线

  - id: rough_translate
    scenario: 翻译
    original: 翻译一下
    personas:
      novice: 翻译一下
      student: 翻译一下,这是份英文合同,翻成中文,要正式一点
      office: 翻译一下,要直译,意思一个都不能变,但读起来又要自然流畅

  - id: rough_improve_sales
    scenario: 数据分析
    original: 怎么提升销售额
    personas:
      novice: 怎么提升销售额
      student: 怎么提升销售额,我们店上个月卖了100万,老板说要翻三倍到300万
      office: 怎么提升销售额,要具体能落地的方案,但不能太长,一页以内,还要能直接跟老板汇报

  - id: rough_weekly_report
    scenario: 写作
    original: AI 帮我写周报
    personas:
      novice: AI 帮我写周报
      student: AI 帮我写周报,这周我完成了7项工作,其实有2项还没做完,你按7项写
      office: AI 帮我写周报,要详细但不能太长,格式正式但别用套话

  - id: rough_error
    scenario: 问答
    original: 这个报错怎么办
    personas:
      novice: 这个报错怎么办
      student: 这个报错怎么办,应该是端口被占用了,我换了端口还是报
      office: 这个报错怎么办,客户等着,很急,但你要把原因解释清楚,别只甩个命令
