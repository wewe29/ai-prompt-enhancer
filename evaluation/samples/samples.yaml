    original: |
      帮我写3版暑期少儿编程班的广告文案。目标人群是 8-12 岁孩子的家长，
       卖点是培养逻辑思维、Scratch/Python 入门、小班教学。每版风格不同，都要有标题和一句话 slogan。
    personas:
      novice: 帮我写个广告文案,就是那个少儿编程班的,暑假招生的,写3个版本的,每个要有标题
      student: 老师布置的作业,给暑期少儿编程班写广告文案,面向8-12岁孩子家长,卖点是逻辑思维、Scratch/Python入门、小班教学,3版不同风格,都要标题和slogan
      office: 我们少儿编程班暑期招生,需要3版不同风格的广告文案,面向8-12岁孩子家长,突出逻辑思维、Scratch/Python入门和小班教学,每版都要标题和一句话slogan

  - id: vague_request
    scenario: 模糊请求
    original: |
      帮我写个方案。
    personas:
      novice: 帮我写个方案,我不知道写啥,你帮我写一个吧
      student: 老师布置的作业,要写个方案,帮我写一下,要交的
