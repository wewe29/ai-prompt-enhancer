# 模型横向评测配置（evaluation/model_benchmark.py）
api:
  base_url: https://ark.cn-beijing.volces.com/api/plan
  protocol: anthropic
  api_key_env: ARK_PLAN_API_KEY
  api_key_file: key.local
enhancer:
  base_url: https://ark.cn-beijing.volces.com/api/v3
  protocol: openai
  model: doubao-seed-2-1-pro-260628
  api_key_env: ARK_API_KEY
  temperature: 0.35
# 按场景的生成温度（场景关键字 → 温度）；样本自带 temperature 字段优先；未命中用 params.temperature
scenario_temperatures:
  编程: 0.2
  翻译: 0.2
  数据分析: 0.2
  问答: 0.4
  写作: 0.5
  模糊请求: 0.5
  创意: 0.7
judge:
  model: deepseek-v4-flash
  temperature: 0
  weights: { quality: 0.7, relevance: 0.2, speed: 0.1 }
# 按场景的综合分维度权重（命中时 composite = Σ 各维度×场景权重，归一化到 1；未命中用 judge.weights 公式）
scenario_weights:
  编程: { accuracy: 0.4, completeness: 0.3, relevance: 0.2, clarity: 0.1 }
  创意: { accuracy: 0.15, completeness: 0.15, relevance: 0.25, clarity: 0.2, novelty: 0.25 }
models:
  - { id: doubao-seed-2.0-mini, label: 豆包 2.0 mini }
  - { id: glm-5.2, label: GLM-5.2 }
  - { id: deepseek-v4-flash, label: DeepSeek V4 Flash }
prompts: []
samples_file: samples/samples.yaml
params:
  max_tokens: 4096
  timeout_s: 240
  retries: 2
  retry_backoff_s: [2, 5]
  delay_between_s: 1.0
  temperature: 0.7
run:
  out_dir: results/benchmark
